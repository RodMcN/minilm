[project]
name = "minilm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "accelerate>=1.14.0",
  "datasets>=5.0.1",
  "fastapi>=0.140.13",
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.8",
  "matplotlib>=3.11.1",
  "seaborn>=0.13.2",
  "tensorboard>=2.21.0",
  "tokenizers>=0.22.2",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "tqdm>=4.70.0",
  "transformers>=5.14.1",
  "uvicorn>=0.30",
]

[project.scripts]
download-smollm-dev = "minilm.data.smollm_corpus:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
